# Deploy: run from repo root after `sam build --template-file sam-template.yaml`.
# Use `sam deploy` without --template-file so this file is picked up (SAM looks
# for samconfig.toml next to the template when --template-file points under .aws-sam/build/).

version = 0.1

[default.deploy.parameters]
stack_name = "dosce25-api"
resolve_s3 = true
s3_prefix = "dosce25-api"
region = "us-east-1"
confirm_changeset = false
capabilities = "CAPABILITY_IAM"
image_repositories = []
